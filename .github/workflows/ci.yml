name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate skills and manifests
        run: node scripts/validate.mjs
      - name: Validate Claude plugin manifests
        run: npx -y @anthropic-ai/claude-code@2.1.316 plugin validate .
      - name: Test bundled scripts
        run: node --test tests/*.test.mjs
      - name: Skills CLI discovers every skill
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          out=$(npx -y skills@1.7.4 add . --list 2>&1)
          for d in skills/*/; do
            name=$(basename "$d")
            echo "$out" | grep -q "$name" || { echo "skills CLI did not list $name"; exit 1; }
          done
